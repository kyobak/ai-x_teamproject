# CI: 푸시·PR 마다 백엔드 테스트 + 웹 lint/build. 계획서 6주차 "CI(린트·테스트) 구성".
name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r server/requirements.txt
      - run: python -m pytest tests -q
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  frame-storage-guard:
    # 계획서 협업 규칙: vision 폴더에 프레임 저장 코드가 들어가면 실패
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if grep -rnE "imwrite|VideoWriter" vision/ --include=*.py | grep -v "zone_tool.py"; then
            echo "::error::vision/ 에 프레임 저장 코드가 있습니다 (REQ-VIS-01)"; exit 1; fi
